<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/html4/strict.dtd">
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta http-equiv="Content-Style-Type" content="text/css">
  <title></title>
  <meta name="Generator" content="Cocoa HTML Writer">

  <style type="text/css">
    p.p1 {margin: 0.0px 0.0px 0.0px 0.0px; font: 12.0px Times; color: #0000e9; -webkit-text-stroke: #0000e9}
    p.p2 {margin: 0.0px 0.0px 0.0px 0.0px; text-align: center; font: 9.4px Times; color: #0c0e12; -webkit-text-stroke: #0c0e12}
    p.p3 {margin: 0.0px 0.0px 0.0px 0.0px; text-align: center; font: 9.4px 'Songti SC'; -webkit-text-stroke: #000000}
    p.p4 {margin: 0.0px 0.0px 0.0px 0.0px; text-align: center; font: 9.4px 'Kohinoor Bangla'; -webkit-text-stroke: #000000}
    p.p5 {margin: 0.0px 0.0px 0.0px 0.0px; font: 12.0px Times; -webkit-text-stroke: #000000}
    span.s1 {text-decoration: underline ; font-kerning: none}
    span.s2 {font-kerning: none}
  </style>
</head>
<body>
<p class="p1"><span class="s1"><a href="file:///">StackSage</a></span></p>
<p class="p1"><span class="s1"><a href="file:///">Explore </a><a href="file:///history">History </a><a href="file:///bookmarks">Bookmarks</a></span></p>
<p class="p2"><span class="s2"><b>EN</b></span></p>
<p class="p3"><span class="s2"><b>中文</b><b></b></span></p>
<p class="p4"><span class="s2"><b>বাংলা</b><b></b></span></p>
<p class="p5"><span class="s2">{% with messages = get_flashed_messages(with_categories=true) %} {% if messages %}</span></p>
<p class="p5"><span class="s2">{% for cat, msg in messages %}</span></p>
<p class="p5"><span class="s2">{{ msg }}</span></p>
<p class="p5"><span class="s2">{% endfor %}</span></p>
<p class="p5"><span class="s2">{% endif %} {% endwith %}</span></p>
<p class="p5"><span class="s2">{% block content %}{% endblock %}</span></p>
<p class="p5"><span class="s2">StackSage<span class="Apple-converted-space">  </span>Developed by NK</span></p>
